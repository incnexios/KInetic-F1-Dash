<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Live Track Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0A0C0F; color: #E7EAEE;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  
  .overlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 24px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10;
  }
  
  .title { margin: 0 0 8px 0; font-size: 24px; font-weight: bold; }
  
  .status-container { display: flex; gap: 12px; align-items: center; }
  
  .status-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    border: 1px solid;
  }
  
  .status-badge.live { border-color: rgba(34,197,94,0.3); color: #4ade80; }
  .status-badge.live .dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.8); }
  
  .status-badge.offline { border-color: rgba(239,68,68,0.3); color: #f87171; }
  .status-badge.offline .dot { background: #ef4444; }
  
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  
  .driver-count {
    display: none; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500; color: #cbd5e1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
  }
  .driver-count.visible { display: flex; }
  
  .zoom-controls {
    position: absolute; right: 24px; bottom: 24px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 10;
  }
  
  .zoom-btn {
    width: 40px; height: 40px;
    background: rgba(18,21,26,0.9); border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1; font-size: 20px; line-height: 1;
    border-radius: 8px; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    backdrop-filter: blur(4px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    transition: all 0.2s;
  }
  
  .zoom-btn:hover { background: #1A1E24; color: #fff; }
  .zoom-btn:active { background: #23272E; }
</style>
</head>
<body>
  <div class="overlay">
    <div>
      <div class="status-container">
        <div id="statusBadge" class="status-badge offline">
          <div class="dot"></div>
          <span id="statusText">DISCONNECTED</span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="mapCanvas"></canvas>
  
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn" title="Zoom In">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
    </button>
    <button class="zoom-btn" id="zoomOut" title="Zoom Out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
    </button>
    <button class="zoom-btn" id="zoomReset" title="Reset View" style="margin-top: 4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
    </button>
  </div>

<script>
(function(){
  "use strict";

  const WS_URL = "wss://api.pitwall.me/ws";
  const RECONNECT_MS = 5000;
  const TRAIL_MAX = 25000;

  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const driverCount = document.getElementById('driverCount');
  const driverCountText = document.getElementById('driverCountText');

  let ws = null;
  let reconnectTimer = null;

  // State
  const driverList = {};
  const timingLines = {};
  const carPos = {}; 
  const trail = new Float32Array(TRAIL_MAX * 2);
  let trailLen = 0;
  const lastTrailPoint = {};
  let bounds = null;

  // Viewport
  let zoom = 1;
  let panX = 0, panY = 0;
  const MIN_ZOOM = 0.3, MAX_ZOOM = 15;

  let isDragging = false;
  let dragStart = { x:0, y:0 };
  let panStart = { x:0, y:0 };

  // --- UI Updates ---
  function updateConnectionStatus(connected) {
    if (connected) {
      statusBadge.className = 'status-badge live';
      statusText.textContent = 'LIVE';
    } else {
      statusBadge.className = 'status-badge offline';
      statusText.textContent = 'DISCONNECTED';
    }
  }

  function updateDriverCount() {
    const active = Object.keys(carPos).length;
    if (active > 0) {
      driverCount.classList.add('visible');
      driverCountText.textContent = `${active} Drivers on track`;
    } else {
      driverCount.classList.remove('visible');
    }
  }

  // --- Input Handling ---
  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    canvas.classList.add('dragging');
    dragStart = { x: e.clientX, y: e.clientY };
    panStart = { x: panX, y: panY };
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX = panStart.x + (e.clientX - dragStart.x);
    panY = panStart.y + (e.clientY - dragStart.y);
  });
  window.addEventListener('mouseup', () => {
    isDragging = false;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const before = zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * (e.deltaY < 0 ? 1.15 : 0.85)));
    const scaleChange = zoom / before;
    panX = mx - (mx - panX) * scaleChange;
    panY = my - (my - panY) * scaleChange;
  }, { passive:false });

  let touchState = null;
  function pinchInfo(touches){
    const rect = canvas.getBoundingClientRect();
    const [a,b] = [touches[0], touches[1]];
    return {
      dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      midX: (a.clientX + b.clientX)/2 - rect.left,
      midY: (a.clientY + b.clientY)/2 - rect.top
    };
  }

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1){
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      panStart = { x: panX, y: panY };
    } else if (e.touches.length === 2){
      isDragging = false;
      touchState = pinchInfo(e.touches);
    }
  }, { passive:true });
  
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging){
      panX = panStart.x + (e.touches[0].clientX - dragStart.x);
      panY = panStart.y + (e.touches[0].clientY - dragStart.y);
    } else if (e.touches.length === 2 && touchState){
      e.preventDefault();
      const now = pinchInfo(e.touches);
      const before = zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * (now.dist / touchState.dist)));
      const scaleChange = zoom / before;
      panX = now.midX - (now.midX - panX) * scaleChange;
      panY = now.midY - (now.midY - panY) * scaleChange;
      touchState = now;
    }
  }, { passive:false });
  canvas.addEventListener('touchend', () => { isDragging = false; touchState = null; });

  function zoomAtCenter(factor){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const before = zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    const scaleChange = zoom / before;
    panX = w/2 - (w/2 - panX) * scaleChange;
    panY = h/2 - (h/2 - panY) * scaleChange;
  }

  document.getElementById('zoomIn').addEventListener('click', () => zoomAtCenter(1.25));
  document.getElementById('zoomOut').addEventListener('click', () => zoomAtCenter(0.8));
  document.getElementById('zoomReset').addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; });

  // --- WebSocket ---
  function connect(){
    try {
      ws = new WebSocket(WS_URL);
      ws.binaryType = 'arraybuffer';
    } catch(e) {
      scheduleReconnect();
      return;
    }
    ws.onopen = () => updateConnectionStatus(true);
    
    ws.onmessage = (evt) => {
      let raw;
      try {
        if (evt.data instanceof ArrayBuffer) {
          raw = new TextDecoder().decode(pako.inflate(new Uint8Array(evt.data)));
        } else {
          raw = evt.data;
        }
        const obj = JSON.parse(raw);
        if (obj && obj.type === 'bundle' && Array.isArray(obj.messages)){
          obj.messages.forEach(processMessage);
        } else {
          processMessage(obj);
        }
      } catch(e) {}
    };
    ws.onclose = () => { 
      updateConnectionStatus(false);
      ws = null; 
      scheduleReconnect(); 
    };
    ws.onerror = () => {};
  }

  function scheduleReconnect(){
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, RECONNECT_MS);
  }

  // --- Data Processing ---
  function processMessage(msg){
    if (!msg || typeof msg !== 'object') return;
    if (msg.R && typeof msg.R === 'object'){
      applyInitialState(msg.R);
      return;
    }
    if (Array.isArray(msg.M)){
      for (let i = 0; i < msg.M.length; i++){
        const entry = msg.M[i];
        if (entry && entry.H === 'Streaming' && entry.M === 'feed' && Array.isArray(entry.A) && entry.A.length >= 2){
          applyFeedUpdate(entry.A[0], entry.A[1]);
        }
      }
      return;
    }
    if (Array.isArray(msg) && msg.length >= 2 && typeof msg[0] === 'string'){
      applyFeedUpdate(msg[0], msg[1]);
    }
  }

  function applyInitialState(state){
    if (state.DriverList) mergeDriverList(state.DriverList);
    if (state.TimingData && state.TimingData.Lines) mergeTimingLines(state.TimingData.Lines);
    const posBlob = state['Position.z'] || state.PositionZ;
    if (posBlob) decodePositionBlob(posBlob);
  }

  function applyFeedUpdate(key, value){
    switch(key){
      case 'DriverList': mergeDriverList(value); break;
      case 'TimingData': if (value && value.Lines) mergeTimingLines(value.Lines); break;
      case 'Position.z':
      case 'PositionZ': decodePositionBlob(value); break;
    }
  }

  function mergeDriverList(list){
    for (const num in list){
      if (!list.hasOwnProperty(num)) continue;
      const d = list[num];
      if (!driverList[num]) driverList[num] = { tla: '', teamColour: '#ffffff' };
      if (d.Tla) driverList[num].tla = d.Tla;
      if (d.TeamColour) driverList[num].teamColour = d.TeamColour.startsWith('#') ? d.TeamColour : '#' + d.TeamColour;
    }
    updateDriverCount();
  }

  function mergeTimingLines(lines){
    for (const num in lines){
      if (!lines.hasOwnProperty(num)) continue;
      const l = lines[num];
      if (!timingLines[num]) timingLines[num] = { inPit: false, retired: false };
      if (l.InPit !== undefined) timingLines[num].inPit = l.InPit;
      if (l.Retired !== undefined) timingLines[num].retired = l.Retired;
    }
  }

  function decodePositionBlob(b64){
    if (!b64 || typeof b64 !== 'string') return;
    let parsed;
    try{
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const text = new TextDecoder().decode(pako.inflateRaw(bytes));
      parsed = JSON.parse(text);
    }catch(e){ return; }
    
    const frames = parsed && parsed.Position;
    if (!Array.isArray(frames) || frames.length === 0) return;
    const latest = frames[frames.length - 1];
    if (!latest || !latest.Entries) return;

    const now = performance.now();
    for (const num in latest.Entries){
      if (!latest.Entries.hasOwnProperty(num)) continue;
      const e = latest.Entries[num];
      if (typeof e.X !== 'number' || typeof e.Y !== 'number') continue;
      
      if (!carPos[num]){
        carPos[num] = { 
          x: e.X, y: e.Y, 
          startX: e.X, startY: e.Y,
          targetX: e.X, targetY: e.Y,
          startTime: now, targetTime: now + 300,
          lastPacketTime: now
        };
      } else {
        const dt = now - carPos[num].lastPacketTime;
        carPos[num].lastPacketTime = now;
        
        carPos[num].startX = carPos[num].x;
        carPos[num].startY = carPos[num].y;
        carPos[num].targetX = e.X;
        carPos[num].targetY = e.Y;
        carPos[num].startTime = now;
        // Smooth the packet arrival time to avoid jitter, limit bounds
        carPos[num].targetTime = now + Math.min(Math.max(dt, 200), 1000);
      }
      
      pushTrailPoint(num, e.X, e.Y);
    }
    updateDriverCount();
  }

  function pushTrailPoint(num, x, y){
    const last = lastTrailPoint[num];
    if (last){
      const dx = x - last[0], dy = y - last[1];
      if ((dx*dx + dy*dy) < 2000) return;
    }
    lastTrailPoint[num] = [x, y];
    const idx = trailLen * 2;
    trail[idx] = x;
    trail[idx + 1] = y;
    trailLen = (trailLen + 1) % TRAIL_MAX;

    if (!bounds){
      bounds = { minX:x, maxX:x, minY:y, maxY:y };
    } else {
      if (x < bounds.minX) bounds.minX = x;
      if (x > bounds.maxX) bounds.maxX = x;
      if (y < bounds.minY) bounds.minY = y;
      if (y > bounds.maxY) bounds.maxY = y;
    }
  }

  // --- Rendering ---
  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function draw(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle = '#0A0C0F';
    ctx.fillRect(0, 0, w, h);

    if (!bounds || trailLen < 2){
      requestAnimationFrame(draw);
      return;
    }

    // Interpolate positions continuously based on time elapsed
    const now = performance.now();
    for (const num in carPos) {
      const p = carPos[num];
      if (p.targetTime > p.startTime) {
        let t = (now - p.startTime) / (p.targetTime - p.startTime);
        t = Math.min(Math.max(t, 0), 1); // Clamp between 0.0 and 1.0
        p.x = p.startX + (p.targetX - p.startX) * t;
        p.y = p.startY + (p.targetY - p.startY) * t;
      } else {
        p.x = p.targetX;
        p.y = p.targetY;
      }
    }

    const padding = 120;
    const bw = Math.max(bounds.maxX - bounds.minX, 1);
    const bh = Math.max(bounds.maxY - bounds.minY, 1);
    const fit = Math.min((w - padding*2) / bw, (h - padding*2) / bh);
    const offX = padding + (w - padding*2 - bw*fit) / 2;
    const offY = padding + (h - padding*2 - bh*fit) / 2;
    const zoomFit = zoom * fit;
    const sqrtZoom = Math.sqrt(zoom);

    // Draw trail
    ctx.fillStyle = 'rgba(58, 66, 76, 0.4)';
    const trailR = Math.max(1.5, 2.0 * sqrtZoom);
    const endIdx = trailLen === TRAIL_MAX ? TRAIL_MAX : trailLen;
    ctx.beginPath();
    for (let i = 0; i < endIdx; i++){
      const idx = i * 2;
      const px = offX + (trail[idx] - bounds.minX) * zoomFit + panX;
      const py = h - (offY + (trail[idx + 1] - bounds.minY) * zoomFit) + panY;
      // Using rect is much faster than arc for thousands of tiny points
      ctx.rect(px - trailR/2, py - trailR/2, trailR, trailR);
    }
    ctx.fill();

    // Draw cars
    const dotR = 6 * sqrtZoom;
    const fontSize = Math.max(10, 11 * sqrtZoom);
    ctx.font = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 2;

    for (const num in carPos){
      const p = carPos[num];
      const d = driverList[num];
      const t = timingLines[num];
      if (t && t.retired) continue;
      
      const px = offX + (p.x - bounds.minX) * zoomFit + panX;
      const py = h - (offY + (p.y - bounds.minY) * zoomFit) + panY;
      
      const isPit = t && t.inPit;
      const color = isPit ? '#9AA3AD' : (d && d.teamColour ? d.teamColour : '#E7EAEE');
      
      ctx.shadowColor = color;
      ctx.shadowBlur = isPit ? 0 : 8 * sqrtZoom;
      
      ctx.beginPath();
      ctx.arc(px, py, dotR, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#0A0C0F';
      ctx.stroke();

      const tagText = (d && d.tla) ? d.tla : num;
      const textOffset = dotR + 6;
      const textMetrics = ctx.measureText(tagText);
      const tagWidth = textMetrics.width;
      const tagHeight = fontSize + 4;
      
      ctx.fillStyle = 'rgba(10, 12, 15, 0.75)';
      ctx.beginPath();
      // Polyfill for roundRect on older browsers if needed, but modern browsers support it well
      if (ctx.roundRect) {
        ctx.roundRect(px + textOffset - 4, py - tagHeight/2, tagWidth + 8, tagHeight, 4);
      } else {
        ctx.rect(px + textOffset - 4, py - tagHeight/2, tagWidth + 8, tagHeight);
      }
      ctx.fill();
      
      ctx.fillStyle = isPit ? '#9AA3AD' : '#E7EAEE';
      ctx.fillText(tagText, px + textOffset, py);
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
  connect();
})();
</script>
</body>
</html>
